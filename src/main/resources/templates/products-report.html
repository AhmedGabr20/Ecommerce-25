<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <style>

        @font-face {
            font-family: 'Dubai';
            src: url('fonts/Dubai-Regular.ttf');
        }

        body {
            font-family: 'Dubai';
            direction: rtl;
            unicode-bidi: embed;
            text-align: right;
        }

        table, tr, td, th {
            direction: rtl;
        }

        .header {
            margin-bottom: 25px;
        }

        .company {
            font-size: 30px;
            font-weight: bold;
            color: #0d6efd;
        }

        .report-title {
            font-size: 22px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .meta {
            margin-top: 5px;
            color: #666;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background: #0d6efd;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        td {
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 13px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }

    </style>

</head>

<body>

<div class="header">

    <div class="company">
        متجر الأدوات
    </div>

    <div class="report-title">
        تقرير المنتجات
    </div>

    <div class="meta">
        تاريخ الإنشاء:
        {{DATE}}
    </div>

    <div class="meta">
        عدد المنتجات:
        {{TOTAL}}
    </div>

    <div class="meta">
        البحث:
        {{SEARCH}}
    </div>

</div>

<table>

    <thead>
    <tr>
        <th>الرقم</th>
        <th>المنتج</th>
        <th>SKU</th>
        <th>السعر</th>
        <th>المخزون</th>
    </tr>
    </thead>

    <tbody>
    {{ROWS}}
    </tbody>

</table>

<div class="footer">
    تم إنشاء التقرير بواسطة لوحة التحكم
</div>

</body>

</html>
